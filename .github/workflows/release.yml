name: Release

on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:
    inputs:
      version_bump:
        description: Optional patch, minor, or major bump
        type: choice
        options: ['', patch, minor, major]
        default: ''
      version:
        description: Optional exact X.Y.Z version
        type: string
        required: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Generate from the live specification
        run: ./scripts/generate
      - name: Plan release
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.version_bump }}
        run: >-
          python3 scripts/release.py plan --event "$EVENT_NAME"
          --version "$INPUT_VERSION" --bump "$INPUT_BUMP"
          --notes "$RUNNER_TEMP/release-notes.md"
      - name: Refresh workspace version in lockfile
        if: steps.plan.outputs.release == 'true'
        run: cargo update --workspace
      - name: Verify release package
        if: steps.plan.outputs.release == 'true'
        run: ./scripts/check
      - name: Verify minimum supported Rust version
        if: steps.plan.outputs.release == 'true'
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          cargo +1.88.0 check --locked --lib
      - name: Check registry publication
        id: publication
        if: steps.plan.outputs.release == 'true'
        run: python3 scripts/release.py publication
      - name: Authenticate to crates.io
        id: auth
        if: steps.plan.outputs.release == 'true' && steps.publication.outputs.publish == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        if: steps.plan.outputs.release == 'true' && steps.publication.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --allow-dirty
      - name: Commit, tag, and push
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "release: v$VERSION" --allow-empty
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$VERSION"
      - name: Reconcile GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py github-release --notes "$RUNNER_TEMP/release-notes.md"
