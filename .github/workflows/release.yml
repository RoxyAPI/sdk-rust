name: Release

on:
  schedule:
    - cron: '20 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the scheduled release plan without publishing
        type: boolean
        default: false
      version_bump:
        description: Optional patch, minor, or major bump
        type: choice
        options: ['', patch, minor, major]
        default: ''
      version:
        description: Optional exact X.Y.Z version
        type: string
        required: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: '1.97.1'

jobs:
  # Generates, classifies, commits locally and runs the full gate with read-only
  # permissions. The verified release commit travels to the publish job as a
  # git bundle, so the job holding publishing credentials builds nothing.
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.publication.outputs.publish }}
      commit: ${{ steps.bundle.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2,cargo-semver-checks@0.51.0
          fallback: none
      - name: Generate from the live specification
        run: ./scripts/generate
      - name: Plan release
        id: plan
        env:
          EVENT_NAME: ${{ inputs.dry_run && 'schedule' || github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.version_bump }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          python3 scripts/release.py plan --event "$EVENT_NAME" \
            --version "$INPUT_VERSION" --bump "$INPUT_BUMP" \
            --notes "$RUNNER_TEMP/release/notes.md"
      - name: Refresh workspace version in lockfile
        if: steps.plan.outputs.release == 'true'
        run: cargo update --workspace
      - name: Commit release locally
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "release: v$VERSION" --allow-empty
      - name: Verify release package
        if: steps.plan.outputs.release == 'true'
        run: ./scripts/check
      - name: Verify minimum supported Rust version
        if: steps.plan.outputs.release == 'true'
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          cargo +1.88.0 check --locked --lib
      - name: Check registry publication
        id: publication
        if: steps.plan.outputs.release == 'true' && inputs.dry_run != true
        run: python3 scripts/release.py publication
      - name: Bundle the verified release commit
        id: bundle
        if: steps.plan.outputs.release == 'true' && inputs.dry_run != true
        run: |
          git diff --quiet HEAD
          git bundle create "$RUNNER_TEMP/release/release.bundle" "$GITHUB_SHA..HEAD"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.release == 'true' && inputs.dry_run != true
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  # Holds the only write and token-exchange permissions. It installs no tools
  # and compiles nothing: cargo publish --no-verify packages the commit the
  # plan job verified, then the commit and tag are pushed atomically.
  publish:
    needs: plan
    if: needs.plan.outputs.release == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Restore the verified release commit
        env:
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          git bundle verify "$RUNNER_TEMP/release/release.bundle"
          git fetch "$RUNNER_TEMP/release/release.bundle" HEAD
          git switch --detach "$COMMIT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Authenticate to crates.io
        id: auth
        if: needs.plan.outputs.publish == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        if: needs.plan.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify
      - name: Tag and push
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$VERSION"

  # Runs on days without a release too, so a release whose notes failed to post
  # is recreated from the tagged specifications.
  github-release:
    needs: [plan, publish]
    if: >-
      always() && inputs.dry_run != true && needs.plan.result == 'success'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.release == 'true'
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Reconcile GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py github-release --notes "$RUNNER_TEMP/release/notes.md"
