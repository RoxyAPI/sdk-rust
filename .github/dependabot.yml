version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    ignore:
      # reqwest is re-exported, so its minor (0.x) and major releases are a
      # roxyapi major release and are adopted by hand.
      - dependency-name: reqwest
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /tools/generate
    ignore:
      - dependency-name: openapi-to-rust
    schedule:
      interval: weekly
    groups:
      generator:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
