[package]
name = "roxyapi-codegen"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
[dependencies]
openapi-to-rust = { version = "=0.22.0", default-features = false }
serde_json = "1"
heck = "0.5"
prettyplease = "0.3"
syn = { version = "3", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
