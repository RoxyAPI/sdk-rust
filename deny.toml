# Dependency policy for the published crate, checked by scripts/check.

[graph]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
deny = [
    { crate = "openssl-sys", reason = "TLS uses rustls" },
    { crate = "native-tls", reason = "TLS uses rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
